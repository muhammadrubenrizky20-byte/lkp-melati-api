# ===================================================================
# KONFIGURASI SERVER
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# BATAS UKURAN REQUEST (Sangat Penting untuk Unggah Foto/Video Base64)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# ===================================================================
# KONFIGURASI DATABASE (MySQL / PostgreSQL di Railway)
# ===================================================================
spring.datasource.url=${MYSQL_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lkp_melati?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# KONFIGURASI JPA / HIBERNATE
# ===================================================================
# Otomatis memperbarui struktur tabel (misal tipe kolom jadi LONGTEXT)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect